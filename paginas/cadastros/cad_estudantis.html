<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../style/cadastros.css">
    <title>Projeto Abas</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="/">Projeto Abas</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item" id="dadosPessoais">
                <a class="nav-link" href="./cad_pessoais.html">Dados Pessoais</a>
                </li>
                <li class="nav-item" id="dadosEstudantis">
                <a class="nav-link active" href="./cad_estudantis.html">Dados Estudantis</a>
                </li>
                <li class="nav-item" id="dadosPostais">
                <a class="nav-link" href="./cad_postais.html">Dados Postais</a>
                </li>
                <li class="nav-item" id="tabelaDinamica">
                <a class="nav-link" href="../tabelas/tabela_dinamica.html">Tabelas Dinamicas</a>
                </li>            
            </ul>
            </div>
        </div>
    </nav>


    <main class="container mt-4">
            
        <h2 class="text-center mb-4">Dados Estudantis</h2>
        
        <hr class="mb-4">

        <form>

            <!-- DADOS DA INSTITUIÇÃO E CURSO -->
            <section class="mb-4">

                <h5 class="mb-3">Dados da Instituição e Curso</h5>

                <div class="d-flex flex-wrap gap-3">
                    <div>
                        <label for="instituicao">Instituição de Ensino *</label>
                        <input
                            type="text"
                            class="form-control mw-ch-35-40"
                            id="instituicao"
                            name="instituicao"
                            placeholder="FATEC Dr. Thomaz Novelino"
                            required
                        >
                    </div>

                    <div>
                        <label for="tipo_instituicao">Tipo de Instituição *</label>
                        <select class="form-select" id="tipo_instituicao" name="tipo_instituicao" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="publica">Pública</option>
                            <option value="privada">Privada</option>
                        </select>
                    </div>

                    <div class=" ">
                        <label for="curso">Curso *</label>
                        <input
                            type="text"
                            class="form-control mw-ch-35-45"
                            id="curso"
                            name="curso"
                            placeholder="Desenvolvimento de Software Multiplataforma"
                            required
                        >
                    </div>

                    <div>
                        <label for="nivel_ensino">Nível de Ensino *</label>
                        <select class="form-select" id="nivel_ensino" name="nivel_ensino" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="fundamental">Ensino Fundamental</option>
                            <option value="medio">Ensino Médio</option>
                            <option value="tecnico">Ensino Técnico</option>
                            <option value="graduacao">Graduação</option>
                            <option value="pos_graduacao">Pós-graduação</option>
                            <option value="mestrado">Mestrado</option>
                            <option value="doutorado">Doutorado</option>
                        </select>
                    </div>

                    <div>
                        <label for="modalidade">Modalidade *</label>
                        <select class="form-select" id="modalidade" name="modalidade" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="presencial">Presencial</option>
                            <option value="ead">EAD</option>
                            <option value="hibrido">Híbrido</option>
                        </select>
                    </div>
                </div>

            </section>

            <hr>

            <!-- VÍNCULO E SITUAÇÃO -->
            <section class="my-4">

                <h5 class="mb-3">Vínculo e Situação Acadêmica</h5>

                <div class="d-flex flex-wrap gap-3">
                    <div>
                        <label for="matricula">Número da Matrícula *</label>
                        <input
                            type="text"
                            class="form-control"
                            id="matricula"
                            name="matricula"
                            placeholder="202601234"
                            required
                        >
                    </div>

                    <div>
                        <label for="periodo">Período/Semestre *</label>
                        <input
                            type="text"
                            class="form-control mw-ch-15"
                            id="periodo"
                            name="periodo"
                            placeholder="2º semestre"
                            required
                        >
                    </div>

                    <div>
                        <label for="turno">Turno *</label>
                        <select class="form-select" id="turno" name="turno" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="matutino">Matutino</option>
                            <option value="vespertino">Vespertino</option>
                            <option value="noturno">Noturno</option>
                            <option value="integral">Integral</option>
                        </select>
                    </div>

                    <div class=" ">
                        <label for="situacao">Situação Atual *</label>
                        <select class="form-select mw-ch-16" id="situacao" name="situacao" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="matriculado">Matriculado</option>
                            <option value="trancado">Trancado</option>
                            <option value="concluido">Concluído</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>

            </section>

            <hr>

            <!-- PERÍODO LETIVO -->
            <section class="my-4">

                <h5 class="mb-3">Período Letivo</h5>

                <div class="d-flex flex-wrap gap-3">
                    <div class=" ">
                        <label for="data_inicio">Data de Início *</label>
                        <input
                            type="date"
                            class="form-control"
                            id="data_inicio"
                            name="data_inicio"
                            required
                        >
                    </div>

                    <div class=" ">
                        <label for="previsao_conclusao">Previsão de Conclusão *</label>
                        <input
                            type="date"
                            class="form-control"
                            id="previsao_conclusao"
                            name="previsao_conclusao"
                            required
                        >
                    </div>
                </div>

            </section>

            <hr>

            <!-- BOTÕES -->
            <div class="d-flex justify-content-end mb-5 mt-4">
                <button type="reset" class="btn btn-secondary me-2">Limpar</button>
                <button type="submit" class="btn btn-primary">Salvar dados</button>
            </div>

        </form>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
