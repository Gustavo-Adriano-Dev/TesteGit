<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="../../scripts/buscaEndereco.js" defer></script>
    <link rel="stylesheet" href="../../style/cadastros.css">
    <title>Projeto Abas</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="/">Projeto Abas</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item" id="dadosPessoais">
                <a class="nav-link" href="./cad_pessoais.html">Dados Pessoais</a>
                </li>
                <li class="nav-item" id="dadosEstudantis">
                <a class="nav-link" href="./cad_estudantis.html">Dados Estudantis</a>
                </li>
                <li class="nav-item" id="dadosPostais">
                <a class="nav-link active" href="./cad_postais.html">Dados Postais</a>
                </li>
                <li class="nav-item" id="tabelaDinamica">
                <a class="nav-link" href="../tabelas/tabela_dinamica.html">Tabelas Dinamicas</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>




    <main class="container min-vh-100 py-4">

        <h2 class="text-center mb-4">Dados Postais</h2>
        
        <hr class="mb-4">

        <form>

            <section class="mb-4">
                <h5 class="mb-3 ">Endereço Residencial</h5>
                <div class="d-flex align-items-end gap-3 mb-3">
                    <div>
                        <label for="cep" class="form-label">CEP *</label>
                        <input type="text"
                            class="form-control mw-ch-16"
                            id="cep"
                            name="cep"
                            placeholder="123.456-78"
                            required>
                    </div>

                    <div>
                        <button type="button"
                                class="btn btn-primary"
                                id="buscaEndereco">
                            Buscar
                        </button>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-3 mb-3">

                    <div>
                        <label for="cidade" class="form-label">Cidade *</label>
                        <input type="text"
                            class="form-control mw-ch-35-40"
                            id="cidade"
                            name="cidade"
                            placeholder="São José do Vale do Rio Preto"
                            required>
                    </div>

                    <div>
                        <label for="estado" class="form-label">Estado *</label>
                        <select class="form-select mw-ch-10"
                                id="estado"
                                name="estado"
                                required>
                            <option value="" selected disabled>--</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                    <div>
                        <label for="logradouro" class="form-label">Logradouro *</label>
                        <input type="text"
                            class="form-control mw-ch-35-40"
                            id="logradouro"
                            name="logradouro"
                            placeholder="Rua, Avenida, Praça..."
                            required>
                    </div>

                    <div>
                        <label for="numero" class="form-label">Número *</label>
                        <input type="text"
                            class="form-control mw-ch-14"
                            id="numero"
                            name="numero"
                            placeholder="1234"
                            required>
                    </div>


                    <div>
                        <label for="bairro" class="form-label">Bairro *</label>
                        <input type="text"
                            class="form-control mw-ch-30"
                            id="bairro"
                            name="bairro"
                            placeholder="Centro"
                            required>
                    </div>

                    <div>

                        <div>
                            <label for="complemento" class="form-label">Complemento</label>
                            <input type="text"
                                class="form-control mw-ch-30"
                                id="complemento"
                                name="complemento"
                                placeholder="Apto, Bloco, Casa 2...">
                        </div>
                    </div>

                </div>

            </section>

            <hr>

            <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-secondary me-2">
                    Limpar
                </button>

                <button class="btn btn-primary">
                    Salvar endereço
                </button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
