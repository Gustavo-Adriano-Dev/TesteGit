<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../style/cadastros.css">
    <title>Projeto Abas</title>
    
</head>
<body>
    <header id="header">
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">

            <div class="container-fluid">

                <a class="navbar-brand" href="/">Projeto Abas</a>
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false"
                        aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item" id="dadosPessoais">
                        <a class="nav-link active" href="./cad_pessoais.html">Dados Pessoais</a>
                        </li>
                        <li class="nav-item" id="dadosEstudantis">
                        <a class="nav-link" href="./cad_estudantis.html">Dados Estudantis</a>
                        </li>
                        <li class="nav-item" id="dadosPostais">
                        <a class="nav-link" href="./cad_postais.html">Dados Postais</a>
                        </li>
                        <li class="nav-item" id="tabelaDinamica">
                        <a class="nav-link" href="../tabelas/tabela_dinamica.html">Tabelas Dinamicas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container min-vh-100 py-4">

        <h2 class="text-center mb-4">Dados Pessoais</h2>
        
        <hr class="mb-4">

        <form >

            <!-- IDENTIFICAÇÃO BÁSICA -->
            <section class="mb-4">
                <h5 class="mb-3 ">Identificação Básica</h5>
                
                <div class="d-flex flex-wrap gap-3">
                    <div class="mb-3 ">
                        <label for="nome" class="form-label">Nome *</label>
                        <input type="text" class="form-control mw-ch-35-40" id="nome" name="nome"
                            placeholder="Lucas Henrique Almeida Campos" required>
                    </div>

                    <div class="mb-3 ">
                        <label for="sexo" class="form-label">Sexo *</label>
                        <select class="form-select" id="sexo" name="sexo" required>
                            <option selected disabled value="">Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                        </select>
                    </div>

                    <div class="mb-3 ">
                        <label for="estado_civil" class="form-label text-nowrap">Estado Civil *</label>
                        <select class="form-select" id="estado_civil" name="estado_civil" required>
                            <option selected disabled value="">Selecione</option>
                            <option value="solteiro">Solteiro(a)</option>
                            <option value="casado">Casado(a)</option>
                            <option value="divorciado">Divorciado(a)</option>
                            <option value="viuvo">Viúvo(a)</option>
                        </select>
                    </div>

                    <div class="mb-3 ">
                        <label for="nacionalidade" class="form-label">Data de Nascimento*</label>
                        <input type="date" class="form-control" id="dt_nascimento" name="dt_nascimento"  required>
                    </div>

                    <div class="mb-3 ">
                        <label for="naturalidade" class="form-label">Naturalidade *</label>
                        <input type="text" class="form-control" id="naturalidade" name="naturalidade"
                            placeholder="Cristais Paulista"  required>
                    </div>
                </div>
            </section>

            <hr>

            <!-- DOCUMENTAÇÃO -->
            <section class="mb-4">
                <h5 class="mb-3">Documentação</h5>
                
                <div class="d-flex flex-wrap gap-3">
                    <div class="mb-3 ">
                        <label for="cpf" class="form-label">CPF *</label>
                        <input type="text" class="form-control mw-ch-16" id="cpf" name="cpf"
                            placeholder="123.456.789-01"  required>
                    </div>

                    <div class="mb-3 ">
                        <label for="rg" class="form-label">RG *</label>
                        <input type="text" class="form-control mw-ch-14" id="rg" name="rg"
                            placeholder="45.123.678-9"  required>
                    </div>

                    <div class="mb-3 ">
                        <label for="data_emissao_rg" class="form-label text-nowrap">Data Emissão | RG *</label>
                        <input type="date" class="form-control" id="data_emissao_rg" name="data_emissao_rg"
                         required>
                    </div>

                    <div class="mb-3 ">
                        <label for="orgao_emissor" class="form-label text-nowrap">Órgão Emissor | RG *</label>
                        <input type="text" class="form-control mw-ch-10" id="orgao_emissor" name="orgao_emissor"
                            placeholder="SSP-SP"  required>
                    </div>
                </div>
            </section>

            <hr>

            <!-- CONTATO E PROFISSÃO -->
            <section class="mb-4">
                <h5 class="mb-3">Contato e Profissão</h5>
                
                <div class="d-flex flex-wrap gap-3">
                    <div class="mb-3 ">
                        <label for="celular" class="form-label">Celular *</label>
                        <input type="tel" class="form-control mw-ch-16" id="celular" name="celular"
                            placeholder="(16) 3721-1234"  required>
                    </div>

                    <div class="mb-3 ">
                        <label for="email" class="form-label">E-mail *</label>
                        <input type="email" class="form-control mw-ch-35-40" id="email" name="email"
                            placeholder="exemplo.contato@email.com.br" required>
                    </div>

                    <div class="mb-3 ">
                        <label for="profissao" class="form-label">Profissão *</label>
                        <input type="text" class="form-control" id="profissao" name="profissao"
                            placeholder="Analista de Sistemas" required>
                    </div>
                </div>
            </section>

            <hr>

            <div class="d-flex justify-content-end mb-5 mt-4">
                <button type="reset" class="btn btn-secondary me-2">Limpar</button>
                <button type="submit" class="btn btn-primary">Salvar dados</button>
            </div>

        </form>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
